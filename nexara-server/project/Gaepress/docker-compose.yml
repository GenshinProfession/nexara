version: "3.8"
services:
  java-service-1:
    build: "./backends/backend-1"
    image: "java-service-1:latest"
    ports:
     - "8082:8082"
    environment:
     - "JAVA_OPTS=-Xmx512m -Xms256m"
     - "SPRING_PROFILES_ACTIVE=prod"
     - "SERVER_PORT=8082"
     - "JAVA_VERSION=21"
    volumes:
     - "/tmp:/tmp"
    restart: "unless-stopped"
    networks:
     - "network-ee048f3a"
  frontend-service:
    image: "nginx:alpine"
    ports:
     - "8000:80"
    volumes:
     - "./frontends:/usr/share/nginx/html:ro"
     - "./frontends/nginx.conf:/etc/nginx/nginx.conf:ro"
    restart: "unless-stopped"
    networks:
     - "network-ee048f3a"
    command:
     - "nginx"
     - "-g"
     - "daemon off;"
networks:
  network-ee048f3a:
    driver: "bridge"
    external: false
    name: "network-ee048f3a"
